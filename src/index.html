<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photographer Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Alice Portfolio</h1>
    <p>Freelance Photographer</p>
  </header>

  <section class="hero">
    <h2>Capturing moments that last a lifetime</h2>
    <a href="#contact" class="cta">Get in Touch</a>
  </section>

  <main>
    <section id="projects">
      <h2>Recent Projects</h2>
      <div class="grid">
        <article class="card">
          <img src="https://via.placeholder.com/400x300?1" alt="Project 1">
          <div class="card-body">
            <h3>Urban Sunset</h3>
            <p>Street photography series.</p>
          </div>
        </article>
        <article class="card">
          <img src="https://via.placeholder.com/400x300?2" alt="Project 2">
          <div class="card-body">
            <h3>Nature Retreat</h3>
            <p>Landscape shots from the mountains.</p>
          </div>
        </article>
        <article class="card">
          <img src="https://via.placeholder.com/400x300?3" alt="Project 3">
          <div class="card-body">
            <h3>Portrait Series</h3>
            <p>Studio portraits with natural light.</p>
          </div>
        </article>
      </div>
    </section>

    <section id="contact" class="contact-section">
      <h2>Contact</h2>
      <form id="contact-form">
        <input type="text" name="name" placeholder="Your name" required>
        <input type="email" name="email" placeholder="Your email" required>
        <textarea name="message" placeholder="Your message" required></textarea>
        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
